<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест словаря</title>
    <style>
        body { background-color: #2b2b2b; color: white; font-family: sans-serif; padding: 50px; }
        .paper { background-color: #f9f6f0; color: #111; padding: 40px; border-radius: 10px; max-width: 800px; margin: 0 auto; }
        .word { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .word-title { color: #d46a8c; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

    <div class="paper">
        <h1>The A0-A1 3000 Word List</h1>
        <div id="dictionary-list">Загрузка...</div>
    </div>

    <script>
        const words = [
            { word: "apple", uk: "UK: [ˈæp.əl]", us: "US: [ˈæp.əl]", ru: "яблоко", ex: "I eat an apple every morning." },
            { word: "water", uk: "UK: [ˈwɔː.tər]", us: "US: [ˈwɑː.t̬ɚ]", ru: "вода", ex: "Can I have a glass of water?" },
            { word: "bread", uk: "UK: [bred]", us: "US: [bred]", ru: "хлеб", ex: "She buys fresh bread at the bakery." }
        ];

        const container = document.getElementById('dictionary-list');
        container.innerHTML = ''; 

        words.forEach(item => {
            const div = document.createElement('div');
            div.className = 'word';
            div.innerHTML = 
                <span class="word-title">${item.word}</span> 
                <span>${item.uk} | ${item.us}</span> 
                <b>${item.ru}</b> 
                <i>${item.ex}</i>
            ;
            container.appendChild(div);
        });
    </script>

</body>
</html>
