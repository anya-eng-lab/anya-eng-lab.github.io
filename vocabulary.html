<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary | Anya's IELTS Lab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: #f9f6f0;
            color: #2c3e2e;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Декоративные полосы на фоне */
        .bg-stripe-green {
            position: absolute;
            left: 15%;
            top: 0;
            bottom: 0;
            width: 20px;
            background-color: #7a9a7e;
            z-index: -1;
        }
        .bg-stripe-pink {
            position: absolute;
            left: 17%;
            top: 0;
            bottom: 0;
            width: 12px;
            background-color: #e8b4c8;
            z-index: -1;
        }

        /* Шапка */
        header {
            padding: 40px 20px;
            text-align: center;
        }
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #d46a8c;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.1rem;
            border-bottom: 2px dashed #d46a8c;
        }
        h1 {
            font-size: 3rem;
            color: #2c3e2e;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #d46a8c;
            margin-top: 10px;
            font-style: italic;
        }

        /* Сетка с уровнями */
        .levels-container {
            max-width: 800px;
            margin: 40px auto 80px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            position: relative;
        }

        /* Пунктирная линия между уровнями (декор) */
        .levels-container::before {
            content: "";
            position: absolute;
            top: 50%;
            left: -20%;
            width: 150%;
            height: 2px;
            border-top: 3px dashed #e8b4c8;
            z-index: -1;
            transform: rotate(-5deg);
        }

        .level-card {
            background: #ffffff;
            border: 4px solid #7a9a7e; /* Толстая обводка */
            border-radius: 20px; /* Скругленные углы */
            padding: 30px 20px;
            text-decoration: none;
            text-align: center;
            color: #2c3e2e;
            transition: all 0.3s ease;
            box-shadow: 8px 8px 0px rgba(122, 154, 126, 0.2); /* Тень в стиле ретро */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .level-card:hover {
            transform: translateY(-8px); /* Подпрыгивает */
            box-shadow: 12px 12px 0px rgba(212, 106, 140, 0.3); /* Тень становится розовой */
            border-color: #d46a8c;
        }

        .level-card h2 {
            font-size: 3rem;
            color: #d46a8c;
            margin-bottom: 10px;
            font-family: 'Courier New', Courier, monospace; /* Шрифт как на наброске */
        }

        .level-card p {
            font-size: 1rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Декор в виде стикера */
        .sticker {
            position: absolute;
            bottom: 40px;
            left: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #7a9a7e;
            transform: rotate(-10deg);
            border: 2px solid #7a9a7e;
            padding: 10px 20px;
            border-radius: 5px;
        }.decor-circle {
            position: absolute;
            top: 20%;
            right: 10%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px dashed #d46a8c;
            z-index: -1;
        }

        /* Адаптация под телефоны */
        @media (max-width: 600px) {
            .levels-container {
                grid-template-columns: 1fr; /* На телефоне в одну колонку */
            }
            h1 { font-size: 2rem; }
            .bg-stripe-green { left: 5%; }
            .bg-stripe-pink { left: 8%; }
            .sticker { display: none; } /* Прячем стикер на телефоне */
        }
    </style>
</head>
<body>

    <!-- Декор на фоне -->
    <div class="bg-stripe-green"></div>
    <div class="bg-stripe-pink"></div>
    <div class="decor-circle"></div>

    <header>
        <a href="index.html" class="back-btn">← На главную</a>
        <h1>Vocabulary</h1>
        <p class="subtitle">Выбери свой уровень и начни учить слова</p>
    </header>

    <!-- Сетка уровней -->
    <section class="levels-container">
        <a href="#" class="level-card">
            <h2>A0-A1</h2>
            <p>Beginner</p>
        </a>
        <a href="#" class="level-card">
            <h2>A2</h2>
            <p>Elementary</p>
        </a>
        <a href="#" class="level-card">
            <h2>B1</h2>
            <p>Intermediate</p>
        </a>
        <a href="#" class="level-card">
            <h2>B2</h2>
            <p>Upper-Intermediate</p>
        </a>
        <a href="#" class="level-card">
            <h2>C1</h2>
            <p>Advanced</p>
        </a>
        <a href="#" class="level-card">
            <h2>C2</h2>
            <p>Proficiency</p>
        </a>
    </section>

    <!-- Стикер Never give up -->
    <div class="sticker">Never give up</div>

</body>
</html>
