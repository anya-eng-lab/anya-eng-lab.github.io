<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary | Anya's IELTS Lab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: #f9f6f0;
            color: #2c3e2e;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Твои вертикальные полосы слева */
        .bg-stripe-green {
            position: absolute;
            left: 15%;
            top: 0;
            bottom: 0;
            width: 20px;
            background-color: #7a9a7e;
            z-index: -1;
        }
        .bg-stripe-pink {
            position: absolute;
            left: 17%;
            top: 0;
            bottom: 0;
            width: 12px;
            background-color: #e8b4c8;
            z-index: -1;
        }

        /* Шапка */
        header { 
            padding: 40px 20px; 
            text-align: center; 
            position: relative; 
            z-index: 2; 
        }
        .back-btn {
            display: inline-block; 
            text-decoration: none; 
            color: #d46a8c;
            font-weight: bold; 
            margin-bottom: 20px; 
            font-size: 1.1rem;
            border-bottom: 2px dashed #d46a8c;
        }
        h1 { 
            font-size: 3rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: #2c3e2e;
        }
        .subtitle { 
            font-size: 1.2rem; 
            color: #d46a8c; 
            margin-top: 10px; 
            font-style: italic; 
        }

        /* Контейнер для карточек */
        .levels-container {
            max-width: 600px;
            margin: 40px auto 80px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 30px; /* Отступ между карточками */
            position: relative;
        }

        /* Вот твои красивые карточки */
        .level-card {
            background: #ffffff;
            border: 4px solid #7a9a7e;
            border-radius: 20px;
            padding: 30px 20px;
            text-decoration: none;
            text-align: center;
            color: #2c3e2e;
            transition: all 0.3s ease;
            box-shadow: 8px 8px 0px rgba(122, 154, 126, 0.2);
            position: relative;
            z-index: 2; /* Карточки поверх линии */
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        
        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 12px 12px 0px rgba(212, 106, 140, 0.3);
            border-color: #d46a8c;
        }
        
        .level-card h2 {
            font-size: 3rem; 
            color: #d46a8c; 
            margin-bottom: 10px;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .level-card p { 
            font-size: 1rem; 
            color: #555; 
            text-transform: uppercase; 
        }

        /* ТА САМАЯ ЛИНИЯ (Диагональная с петелькой) */
        .swoosh-line {
            position: absolute;
            top: 40%; /* На какой высоте проходит */
            left: -15%;
            width: 130%; /* Длина линии */
            height: 80px; /* Высота петельки */
            border-top: 4px dashed #e8b4c8; /* Пунктир */
            border-radius: 50%; /* Закругление в петельку */
            z-index: 1; /* Под карточками */
            transform: rotate(-6deg); /* Наклон, как на фото */
            pointer-events: none;position: absolute; 
            bottom: 40px; 
            left: 50px;
            font-size: 1.5rem; 
            font-weight: bold; 
            color: #7a9a7e;
            transform: rotate(-10deg); 
            border: 2px solid #7a9a7e;
            padding: 10px 20px; 
            border-radius: 5px; 
            z-index: 10;
            background: #f9f6f0;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .level-card h2 { font-size: 2.5rem; }
            .bg-stripe-green { left: 5%; }
            .bg-stripe-pink { left: 8%; }
            .swoosh-line { display: none; }
            .sticker { display: none; }
        }
    </style>
</head>
<body>

    <!-- Вертикальные полосы -->
    <div class="bg-stripe-green"></div>
    <div class="bg-stripe-pink"></div>

    <header>
        <a href="index.html" class="back-btn">← На главную</a>
        <h1>Vocabulary</h1>
        <p class="subtitle">Выбери свой уровень и начни учить слова</p>
    </header>

    <section class="levels-container">
        <!-- Линия с петелькой -->
        <div class="swoosh-line"></div>

        <a href="#" class="level-card"><h2>A0-A1</h2><p>Beginner</p></a>
        <a href="#" class="level-card"><h2>A2</h2><p>Elementary</p></a>
        <a href="#" class="level-card"><h2>B1</h2><p>Intermediate</p></a>
        <a href="#" class="level-card"><h2>B2</h2><p>Upper-Intermediate</p></a>
        <a href="#" class="level-card"><h2>C1</h2><p>Advanced</p></a>
        <a href="#" class="level-card"><h2>C2</h2><p>Proficiency</p></a>
    </section>

    <div class="sticker">Never give up</div>

</body>
</html>

        .sticker {
